[package]
name = "ngai_tunes"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ngai-tunes"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lofty = "0.22"
crossterm = "0.28"
ratatui = "0.29"
libc = "0.2"
serde_json = "1"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
