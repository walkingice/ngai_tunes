[package]
name = "ngai_tunes"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ngai-tunes"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lofty = "0.22"
crossterm = "0.28"
ratatui = "0.29"
libc = "0.2"
serde_json = "1"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
crossbeam-channel = "0.5"
resvg = { version = "0.45", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
tao = { version = "0.35", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }

[package.metadata.bundle.bin.ngai-tunes]
name = "Ngai Tunes"
identifier = "io.github.walkingice.ngai-tunes"
icon = ["src/client/menu/icon.svg"]
